services:
  db:
    image: postgres:16
    container_name: vertika-db
    environment:
      POSTGRES_USER: vertika
      POSTGRES_PASSWORD: vertika
      POSTGRES_DB: vertika
    ports:
      - "5432:5432"
    volumes:
      - vertika_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vertika -d vertika"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    profiles: ["full"]
    build: ./backend
    container_name: vertika-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: "8080"
      RUST_LOG: vertika_backend=info,tower_http=info,sqlx=warn
      DATABASE_URL: postgres://vertika:vertika@db:5432/vertika
      AUTH_REQUIRED: "false"
      AUTH_SECRET: vertika-dev-secret-change-in-prod
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "8080:8080"

volumes:
  vertika_pgdata:
