[package]
name = "vertika-backend"
version = "0.1.0"
edition = "2021"
description = "Vértika · API y motor contable determinista para copropiedades (PUC ESAL)"
license = "UNLICENSED"

[dependencies]
axum = { version = "0.7", features = ["macros", "json"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json", "rust_decimal", "migrate"] }
dotenvy = "0.15"
rust_decimal = { version = "1", features = ["serde-float"] }
sha2 = "0.10"
hmac = "0.12"
base64 = "0.22"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[features]
default = []
postgres = []  # reservado; la integración usa sqlx cuando DATABASE_URL está definido

[profile.release]
lto = true
codegen-units = 1
strip = true
