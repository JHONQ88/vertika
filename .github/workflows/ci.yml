name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run smoke
      - run: npm run render

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vertika
          POSTGRES_PASSWORD: vertika
          POSTGRES_DB: vertika
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U vertika -d vertika"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Check Rust binary
        working-directory: backend
        run: cargo check
      - name: Run Rust tests against PostgreSQL 16
        working-directory: backend
        env:
          DATABASE_URL: postgres://vertika:vertika@localhost:5432/vertika
        run: cargo test
